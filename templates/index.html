<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tools – Free Online Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Marquee Banner -->
    <div class="broadside-marquee">
        <div class="broadside-marquee__track">
            <span class="broadside-marquee__item">Merge PDF <span class="broadside-marquee__sep"></span></span>
            <span class="broadside-marquee__item">Compress PDF <span class="broadside-marquee__sep"></span></span>
            <span class="broadside-marquee__item">PDF to Image <span class="broadside-marquee__sep"></span></span>
            <span class="broadside-marquee__item broadside-marquee__punch">100% FREE</span>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="hero-section text-center py-5">
        <div class="container">
            <h1 class="hero-title">Your All-in-One PDF Tool</h1>
            <p class="hero-subtitle">Merge, compress, and convert PDFs – fast, free, and easy.</p>
        </div>
    </section>

    <!-- Main Tool Card -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card tool-card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tool Selection Dropdown -->
                        <label for="toolSelect" class="form-label fw-bold text-dark">Select a Tool:</label>
                        <select id="toolSelect" class="form-select tool-select mb-4">
                            <option value="merge" selected>🔗 Merge PDF</option>
                            <option value="compress">🗜️ Compress PDF</option>
                            <option value="pdf-to-image">🖼️ PDF to Image</option>
                            <option value="image-to-pdf">📄 Image to PDF</option>
                        </select>

                        <form action="/merge" method="POST" enctype="multipart/form-data" id="uploadForm">
                            <div class="dropzone" id="dropzone">
                                <input type="file" name="pdf_files" id="fileInput" class="file-input" multiple accept=".pdf" required>
                                <div class="dropzone-content">
                                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="17 8 12 3 7 8"></polyline>
                                        <line x1="12" y1="3" x2="12" y2="15"></line>
                                    </svg>
                                    <p class="dropzone-text mt-3" id="dropzoneText">Drag & drop PDF files here</p>
                                    <p class="dropzone-subtext">or <span class="browse-link">browse</span></p>
                                    <small class="text-muted" id="dropzoneSubtext">Supports multiple PDF files</small>
                                </div>
                            </div>
                            <div id="fileList" class="file-list mt-3"></div>
                            <button type="submit" class="btn btn-merge w-100 mt-4" id="mergeBtn">
                                <span class="btn-text" id="btnText">Merge PDFs</span>
                                <span class="btn-spinner d-none">
                                    <span class="spinner"></span> Processing...
                                </span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center py-4">
        <div class="container">
            <p class="mb-0">© 2025 PDF Tools. Built with ❤️ by Ansh.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
