<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tools – Free Online Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css CDN for high-level animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container justify-content-center">
            <span class="navbar-brand mb-0 h1 fw-bold text-danger animate__animated animate__fadeInDown">📄 PDF Tools</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mb-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark animate__animated animate__fadeInDown">Your All-in-One PDF Tool</h1>
            <p class="text-muted animate__animated animate__fadeInUp animate__delay-1s">Merge, compress, and convert PDFs – fast, free, and easy.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Card zooms in after 1 second -->
                <div class="card shadow-sm border-0 rounded-4 animate__animated animate__zoomIn animate__delay-1s">
                    <div class="card-body p-4 p-md-5">
                        
                        <label for="toolSelect" class="form-label fw-bold">Select a Tool:</label>
                        <select id="toolSelect" class="form-select mb-4 tool-select">
                            <option value="merge" selected>🔗 Merge PDF</option>
                            <option value="compress">🗜️ Compress PDF</option>
                            <option value="pdf-to-image">🖼️ PDF to Image</option>
                            <option value="image-to-pdf">📄 Image to PDF</option>
                        </select>

                        <form action="/merge" method="POST" enctype="multipart/form-data" id="uploadForm">
                            <!-- Simple Bootstrap Dropzone -->
                            <div class="dropzone border rounded-3 p-5 text-center bg-light" id="dropzone">
                                <input type="file" name="pdf_files" id="fileInput" class="file-input" multiple accept=".pdf" required>
                                
                                <!-- Upload Icon with infinite pulse animation -->
                                <svg class="upload-icon animate__animated animate__pulse animate__infinite" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>

                                <p class="mb-2 fw-bold mt-3" id="dropzoneText">Drag & drop PDF files here</p>
                                <p class="text-muted small mb-0">or <span class="text-danger fw-bold" style="cursor:pointer;">browse</span></p>
                                <small class="text-muted d-block mt-2" id="dropzoneSubtext">Supports multiple PDF files</small>
                            </div>
                            
                            <div id="fileList" class="mt-3 small text-muted"></div>
                            
                            <button type="submit" class="btn btn-danger w-100 mt-4 py-2 fw-bold btn-merge" id="mergeBtn">
                                <span class="btn-text" id="btnText">Merge PDFs</span>
                                <span class="btn-spinner d-none">
                                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...
                                </span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-muted small">
        © 2025 PDF Tools. Built with ❤️ by Ansh.
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
